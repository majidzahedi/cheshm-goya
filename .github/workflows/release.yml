name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: app
        run: ./gradlew -PcoreOnly=true test :android:testDebugUnitTest
      - name: Build APK
        working-directory: app
        run: ./gradlew :android:assembleDebug
      - name: Rename APK
        run: cp app/android/build/outputs/apk/debug/android-debug.apk "cheshm-goya-${GITHUB_REF_NAME}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          name: چشم‌گویا ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: cheshm-goya-${{ github.ref_name }}.apk
