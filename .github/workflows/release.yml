name: Release

# A release is created either by pushing a tag (v1.2.3), or by pushing a new
# release-notes file docs/release-notes/v1.2.3.md — the workflow then creates the tag.
on:
  push:
    tags: ["v*"]
    paths: ["docs/release-notes/v*.md"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. v1.0.0); needs docs/release-notes/<version>.md"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine version
        id: v
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME}"
          else
            V=$(git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- 'docs/release-notes/v*.md' | sort -V | tail -1 | xargs -r basename -s .md)
          fi
          if [ -z "$V" ] || [ ! -f "docs/release-notes/$V.md" ]; then echo "no release notes found"; exit 1; fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] && git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "tag $V already exists; nothing to do"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v4
        if: steps.v.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        if: steps.v.outputs.skip != 'true'
      - name: Test
        if: steps.v.outputs.skip != 'true'
        working-directory: app
        run: ./gradlew -PcoreOnly=true test :android:testDebugUnitTest
      - name: Build APK
        if: steps.v.outputs.skip != 'true'
        working-directory: app
        run: ./gradlew :android:assembleDebug
      - name: Rename APK
        if: steps.v.outputs.skip != 'true'
        run: cp app/android/build/outputs/apk/debug/android-debug.apk "cheshm-goya-${{ steps.v.outputs.version }}.apk"
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != 'true'
        with:
          tag_name: ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: چشم‌گویا ${{ steps.v.outputs.version }}
          body_path: docs/release-notes/${{ steps.v.outputs.version }}.md
          files: cheshm-goya-${{ steps.v.outputs.version }}.apk
          make_latest: true
