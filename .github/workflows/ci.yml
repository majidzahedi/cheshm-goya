name: CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Core & Claude unit tests
        run: ./gradlew -PcoreOnly=true test --stacktrace
      - name: Build Android APK
        run: ./gradlew :android:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: cheshm-goya-debug-apk
          path: app/android/build/outputs/apk/debug/*.apk

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (without the heavy model packages)
        run: pip install "fastapi>=0.115,<1" "uvicorn[standard]" pydantic-settings httpx python-multipart "qrcode[pil]" zeroconf numpy pytest
      - run: python -m pytest -q
